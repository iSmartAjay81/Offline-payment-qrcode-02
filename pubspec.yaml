name: offline_payment_qr
description: "A secure, zero-internet offline UPI and bank transfer QR code generator with a photorealistic 3D interactive desk lamp interface."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0

  # Security & Biometrics
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Local Encrypted Data
  shared_preferences: ^2.2.2

  # Document Generation & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

  # Desktop Window & Tray Management (Conditional / graceful fallback)
  window_manager: ^0.3.8

  # State Management & Icons
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/
